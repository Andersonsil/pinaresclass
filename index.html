<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <meta name="description" content="Comunicación aumentativa y alternativa por pictogramas para niños" />
  <title>MiVoz — Comunicación con Pictogramas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
<style>
/* =====================================================
   MiVoz — Comunicación Aumentativa y Alternativa
   Diseño accesible para niños con parálisis cerebral
   u otras dificultades neurológicas del habla.
   ===================================================== */

:root {
  --color-bg: #FFF9F0;
  --color-header: #FFFFFF;
  --color-phrase-bg: #FFFFFF;
  --color-phrase-border: #E0D5C8;
  --color-text: #000000;
  --color-text-muted: #7A746A;
  --color-shadow: rgba(0,0,0,0.08);
  --color-shadow-lg: rgba(0,0,0,0.15);
  --btn-speak-bg: #97192c;
  --btn-speak-hover: #ffffff;
  --btn-clear-bg: #97192c;
  --btn-clear-hover: #ffffff;
  --radius-card: 5px;
  --radius-btn: 5px;
  --radius-chip: 5px;
  --font-main: Arial;
  --picto-font-size: 16px;
  --header-height: 64px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html {
  font-family: var(--font-main);
  background: var(--color-bg);
  color: var(--color-text);
  -webkit-tap-highlight-color: transparent;
}

body {
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
}

/* ---- CABECERA ---- */
.app-header {
  position: sticky; top: 0; z-index: 100;
  background: var(--color-header);
  box-shadow: 0 2px 12px var(--color-shadow);
  height: var(--header-height);
}
.header-inner {
  max-width: 1200px; margin: 0 auto;
  padding: 0 16px; height: 100%;
  display: flex; 
  align-items: center; 
  justify-content: space-between;
}
.logo img{ 
  display: flex; 
  align-items: center; 
  gap: 10px; }
.logo-icon { 
  font-size: 32px; 
  line-height: 1; }
.logo-text { 
  font-size: 26px; 
  font-weight: 900; 
  color: #971515; 
  letter-spacing: -0.5px; }
.btn-settings {
  font-size: 28px; 
  background: none; 
  border: none; 
  cursor: pointer;
  padding: 8px; 
  border-radius: 5%; 
  transition: background 0.2s; 
  line-height: 1;
}
.btn-settings:hover, .btn-settings:focus-visible {
  background: #F0F0F0; 
  outline: 3px solid #971515; 
  outline-offset: 2px;
}

/* ---- BARRA DE FRASE ---- */
.phrase-bar {
  background: var(--color-phrase-bg);
  border-bottom: 2px solid var(--color-phrase-border);
  padding: 12px 16px;
  display: flex; align-items: center; gap: 12px;
  min-height: 88px;
  box-shadow: 0 2px 8px var(--color-shadow);
}
.phrase-icons {
  flex: 1; 
  display: flex; 
  align-items: center; 
  gap: 8px;
  overflow-x: auto; 
  overflow-y: hidden;
  padding: 4px 2px; 
  min-height: 60px;
  scroll-behavior: smooth; 
  -webkit-overflow-scrolling: touch;
}
.phrase-icons::-webkit-scrollbar { 
  height: 4px; }
.phrase-icons::-webkit-scrollbar-track { 
  background: #F0EDE8; border-radius: 4px; }
.phrase-icons::-webkit-scrollbar-thumb { 
  background: #C0BAB0; border-radius: 4px; }
.phrase-placeholder {
  font-size: 15px; 
  color: #97192c;
  font-family: "Mirador";
  font-weight: 900;
  white-space: nowrap; 
  padding: 4px 8px; 
  user-select: none;
}
.phrase-chip {
  display: flex; 
  flex-direction: column; 
  align-items: center; 
  gap: 2px;
  padding: 6px 10px; 
  background: #ffffff;
  border: 2px solid #97192c; 
  border-radius: 2px;
  cursor: pointer; 
  transition: transform 0.15s, 
  background 0.15s;
  flex-shrink: 0; 
  min-width: 56px;
}
.phrase-chip:hover { 
  background: #FDECEA; 
  border-color: #E74C3C; 
  transform: scale(0.95); }
.chip-emoji { 
  font-size: 26px; 
  line-height: 1; }
.chip-label { 
  font-size: 11px; 
  font-weight: 700; 
  color: #E74C3C; 
  white-space: nowrap; }

.phrase-actions { 
  display: flex; 
  flex-direction: column; 
  gap: 8px; 
  flex-shrink: 0; }
.btn-action {
  display: flex; 
  align-items: center; 
  gap: 6px;
  padding: 10px 16px; 
  border: none; 
  border-radius: 5px;
  font-family: var(--font-main); 
  font-size: 15px; 
  font-weight: 800;
  cursor: pointer; 
  transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
  min-width: 110px; 
  justify-content: center;
  box-shadow: 0 3px 8px var(--color-shadow-lg);
}
.btn-action:disabled { 
  opacity: 0.4; 
  cursor: not-allowed; 
  transform: none !important; 
  box-shadow: none; }
.btn-action:not(:disabled):hover { 
  transform: translateY(-2px); 
  box-shadow: 0 5px 14px var(--color-shadow-lg); }
.btn-action:not(:disabled):active { 
  transform: scale(0.96); }
.btn-action:focus-visible { 
  outline: 3px solid #2C2A26; 
  outline-offset: 3px; }
.btn-speak { 
  background: var(--btn-speak-bg); 
  color: #FFF; }
.btn-speak:not(:disabled):hover { 
  background: var(--btn-speak-hover); }
.btn-speak.speaking { 
  animation: pulse-speak 0.6s ease-in-out infinite alternate; }
@keyframes pulse-speak {
  from { 
    transform: scale(1); 
    box-shadow: 0 3px 8px rgba(46,204,113,0.3); }
  to   { 
    transform: scale(1.06); 
    box-shadow: 0 6px 22px rgba(46,204,113,0.6); }
}
.btn-clear { 
  background: var(--btn-clear-bg); 
  color: #FFF; }
.btn-clear:not(:disabled):hover { 
  background: var(--btn-clear-hover); }
.btn-icon { 
  font-size: 18px; 
  line-height: 1; }
.btn-label { 
  font-size: 14px; }

/* ---- CATEGORÍAS ---- */
.categories-nav {
  background: #97192c; 
  border-bottom: 1px solid #EDE8E0;
  padding: 10px 0; 
  position: sticky;
  top: var(--header-height); 
  z-index: 90;
  box-shadow: 0 2px 6px var(--color-shadow);
}
.categories-scroll {
  display: flex; 
  gap: 10px; 
  overflow-x: auto;
  padding: 4px 16px; 
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.categories-scroll::-webkit-scrollbar { 
  display: none; }
.cat-btn {
  display: flex; 
  flex-direction: column; 
  align-items: center; 
  gap: 4px;
  padding: 8px 16px; 
  border: 2.5px solid transparent; 
  border-radius: 5px;
  background: #F5F2EE; 
  cursor: pointer; 
  font-family: var(--font-main);
  font-weight: 700; 
  font-size: 13px; 
  white-space: nowrap; 
  flex-shrink: 0;
  transition: all 0.2s; 
  color: var(--color-text);
}
.cat-btn:hover {
  background: var(--cat-light, #F0F0F0);
  border-color: var(--cat-color, #888); transform: translateY(-1px);
}
.cat-btn.active {
  background: var(--cat-color, #971515); color: #FFF;
  border-color: var(--cat-color, #971515);
  box-shadow: 0 3px 10px rgba(0,0,0,0.18);
}
.cat-btn:focus-visible { 
  outline: 3px solid var(--color-text); 
  outline-offset: 3px; }
.cat-emoji { 
  font-size: 22px; 
  line-height: 1; }
.cat-name  { 
  font-size: 12px; }

/* ---- CUADRÍCULA DE PICTOGRAMAS ---- */
.picto-grid-wrapper {
  flex: 1; 
  padding: 16px;
  max-width: 1200px; 
  width: 100%; 
  margin: 0 auto;
}
.picto-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 16px;
}
.picto-grid.fade-out { 
  opacity: 0; 
  transform: scale(0.97); 
  transition: opacity 0.15s, transform 0.15s; }
.picto-grid.fade-in { 
  animation: fadeIn 0.25s ease-out; }
@keyframes fadeIn {
  from { 
    opacity: 0; 
    transform: scale(0.96); }
  to   { 
    opacity: 1; 
    transform: scale(1); }
}

/* Tarjeta de pictograma */
.picto-card {
  display: flex; 
  flex-direction: column; 
  align-items: center;
  justify-content: center; 
  gap: 10px; 
  padding: 18px 12px;
  background: #FFF; 
  border: 3px solid var(--cat-light, #E0E0E0);
  border-radius: var(--radius-card); 
  cursor: pointer;
  font-family: var(--font-main);
  transition: transform 0.18s, box-shadow 0.18s, border-color 0.18s, background 0.18s;
  box-shadow: 0 3px 10px var(--color-shadow);
  min-height: 140px; 
  user-select: none; 
  -webkit-user-select: none;
  touch-action: manipulation; 
  position: relative; 
  overflow: hidden;
}
.picto-card::before {
  content: ''; 
  position: absolute; 
  inset: 0;
  background: var(--cat-light, #F8F8F8); 
  opacity: 0;
  transition: opacity 0.2s;
  border-radius: calc(var(--radius-card) - 3px);
}
.picto-card:hover::before { 
  opacity: 1; }
.picto-card:hover {
  transform: translateY(-4px) scale(1.02);
  border-color: var(--cat-color, #971515);
  box-shadow: 0 8px 24px var(--color-shadow-lg);
}
.picto-card:focus-visible { 
  outline: 4px solid var(--cat-color, #971515); 
  outline-offset: 3px; }
.picto-card.pressed {
  transform: scale(0.93) !important;
  box-shadow: 0 1px 4px var(--color-shadow) !important;
  border-color: var(--cat-color, #971515) !important;
  background: var(--cat-light, #EEF4FF) !important;
}
.picto-emoji {
  font-size: 58px; 
  line-height: 1; 
  display: block;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,0.10));
  position: relative; 
  z-index: 1; 
  transition: transform 0.18s;
}
.picto-card:hover .picto-emoji { 
  transform: scale(1.08); }
.picto-label {
  font-size: var(--picto-font-size); 
  font-weight: 800;
  color: var(--color-text); 
  text-align: center;
  line-height: 1.2; 
  position: relative; 
  z-index: 1;
}

/* ---- AJUSTES ---- */
.settings-overlay {
  position: fixed; 
  inset: 0; 
  background: rgba(0,0,0,0.45);
  z-index: 200; 
  display: flex; 
  align-items: center;
  justify-content: center; 
  padding: 20px; 
  backdrop-filter: blur(3px);
}
.settings-overlay[hidden] { 
  display: none; }
.settings-panel {
  background: #FFF; 
  border-radius: 24px; 
  padding: 28px 24px;
  width: 100%; 
  max-width: 400px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.25);
  display: flex; 
  flex-direction: column; 
  gap: 20px;
}
.settings-title { 
  font-size: 22px; 
  font-weight: 900; 
  color: #971515; }
.settings-group { 
  display: flex; 
  flex-direction: column; 
  gap: 8px; }
.settings-group label { 
  font-size: 15px; 
  font-weight: 700; }
.settings-group select,
.settings-group input[type="range"] {
  width: 100%; 
  padding: 10px; 
  border: 2px solid #DDD;
  border-radius: 12px; 
  font-family: var(--font-main);
  font-size: 14px; 
  background: #FAFAFA; 
  accent-color: #971515;
}
.btn-close-settings {
  background: #971515; 
  color: #FFF; 
  border: none;
  border-radius: var(--radius-btn); 
  padding: 14px;
  font-family: var(--font-main); 
  font-size: 17px; 
  font-weight: 800;
  cursor: pointer; 
  transition: background 0.2s, transform 0.15s;
}
.btn-close-settings:hover { 
  background: #971515; 
  transform: translateY(-1px); }

/* ---- RESPONSIVO ---- */
@media (max-width: 768px) {
  .picto-grid { 
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); 
    gap: 12px; }
  .picto-emoji { 
    font-size: 46px; }
  .btn-label { 
    display: none; }
  .btn-action { 
    min-width: 52px; 
    padding: 10px; }
}
@media (max-width: 480px) {
  :root { --picto-font-size: 13px; }
  .picto-grid-wrapper { padding: 10px; }
  .picto-grid { 
    grid-template-columns: repeat(3, 1fr); gap: 9px; }
  .picto-card { 
    min-height: 108px; 
    padding: 10px 6px; gap: 7px; }
  .picto-emoji { 
    font-size: 36px; }
  .phrase-bar { 
    padding: 8px 10px; gap: 8px; 
    min-height: 76px; }
  .btn-action { 
    padding: 10px 8px; 
    min-width: 44px; }
  .btn-icon { 
    font-size: 22px; }
  .logo-text { 
    font-size: 20px; }
}
@media (min-width: 1100px) {
  .picto-grid { 
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
  .picto-emoji { 
    font-size: 64px; }
  .picto-card { 
    min-height: 160px; }
}
@media (prefers-contrast: high) {
  .picto-card { 
    border-width: 4px; }
  .cat-btn, .phrase-chip { 
    border-width: 3px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { 
    animation-duration: 0.01ms !important; 
    transition-duration: 0.01ms !important; }
}
:focus-visible { 
  outline: 4px solid #E74C3C; 
  outline-offset: 3px; }
</style>
</head>
<body>

  <!-- CABECERA -->
  <header class="app-header" role="banner">
    <div class="header-inner">
      <div class="logo">
        <img src="logo_pinares.png" alt="logo-pinares" width="100px">
      </div>
      <button class="btn-settings" id="btnSettings" aria-label="Abrir ajustes de voz" title="Ajustes">⚙️</button>

  <!-- BARRA DE FRASE -->
  <section class="phrase-bar" aria-label="Frase construida" role="region">
    <div class="phrase-icons" id="phraseIcons" aria-live="polite" aria-label="Pictogramas seleccionados">

    </div>
    <div class="phrase-actions">

  <!-- PANEL DE AJUSTES -->
  <div class="settings-overlay" id="settingsOverlay" role="dialog" aria-modal="true" aria-label="Ajustes" hidden>

      <div class="settings-group">

        <input type="range" id="rateRange" min="0.5" max="2" step="0.1" value="1" />
      </div>
      <div class="settings-group">
        <label for="pitchRange">Tono: <span id="pitchVal">1.0</span></label>
        <input type="range" id="pitchRange" min="0.5" max="2" step="0.1" value="1" />
      </div>
      <div class="settings-group">
        <label for="fontSizeRange">Tamaño de texto: <span id="fontSizeVal">16</span>px</label>
        <input type="range" id="fontSizeRange" min="12" max="28" step="2" value="16" />
      </div>
      <button class="btn-close-settings" id="btnCloseSettings">Cerrar</button>
    </div>
  </div>

/* =====================================================
   MOTOR DE VOZ — Web Speech API
   ===================================================== */
const VoiceEngine = (() => {
  let voices = [], selectedVoice = null, rate = 1, pitch = 1;

  function loadVoices() {
    voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
    const esVoice = voices.find(v => v.lang.startsWith("es"));
    selectedVoice = esVoice || voices[0] || null;
    return voices;
  }

  if (window.speechSynthesis) {
    window.speechSynthesis.onvoiceschanged = () => {
      loadVoices();
      Settings.populateVoiceSelect();
    };
    loadVoices();
  }

  function speak(text) {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    if (selectedVoice) u.voice = selectedVoice;
    u.rate = rate; u.pitch = pitch;
    u.lang = selectedVoice ? selectedVoice.lang : "es-ES";
    window.speechSynthesis.speak(u);
  }

  return {
    speak,
    setVoice: i => { selectedVoice = voices[i] || null; },
    setRate:  v => { rate = parseFloat(v); },
    setPitch: v => { pitch = parseFloat(v); },
    getVoices: () => voices,
    loadVoices
  };
})();

/* =====================================================
   BARRA DE FRASE
   ===================================================== */
const PhraseBar = (() => {
  const phraseIcons = document.getElementById("phraseIcons");
  const placeholder  = document.getElementById("phrasePlaceholder");
  const btnSpeak     = document.getElementById("btnSpeak");
  const btnClear     = document.getElementById("btnClear");
  let items = [];

  function render() {
    // Eliminar chips existentes
    Array.from(phraseIcons.children).forEach(c => {
      if (c !== placeholder) phraseIcons.removeChild(c);
    });
    placeholder.style.display = items.length === 0 ? "block" : "none";

    items.forEach((item, idx) => {
      const chip = document.createElement("button");
      chip.className = "phrase-chip";
      chip.setAttribute("aria-label", `Quitar ${item.label}`);
      chip.innerHTML = `<span class="chip-emoji" aria-hidden="true">${item.emoji}</span><span class="chip-label">${item.label}</span>`;
      chip.addEventListener("click", () => { items.splice(idx, 1); render(); sync(); });
      phraseIcons.appendChild(chip);
    });
    phraseIcons.scrollLeft = phraseIcons.scrollWidth;
  }

  function sync() {
    btnSpeak.disabled = btnClear.disabled = items.length === 0;
  }

  function add(item) { items.push(item); render(); sync(); }

  function clear() {
    items = []; render(); sync();
    window.speechSynthesis && window.speechSynthesis.cancel();
  }

  function speakPhrase() {
    if (!items.length) return;
    VoiceEngine.speak(items.map(i => i.voz).join(" "));
    btnSpeak.classList.add("speaking");
    setTimeout(() => btnSpeak.classList.remove("speaking"), 1800);
  }

  btnSpeak.addEventListener("click", speakPhrase);
  btnClear.addEventListener("click", clear);

  return { add, clear, speakPhrase };
})();

/* =====================================================
   BARRA DE CATEGORÍAS
   ===================================================== */
const CategoryNav = (() => {
  const container = document.getElementById("categoriesScroll");
  let active = CATEGORIES[0].id;

  function render() {
    container.innerHTML = "";
    CATEGORIES.forEach(cat => {
      const btn = document.createElement("button");
      btn.className = "cat-btn" + (cat.id === active ? " active" : "");
      btn.setAttribute("aria-pressed", cat.id === active ? "true" : "false");
      btn.setAttribute("aria-label", `Categoría ${cat.nombre}`);
      btn.style.setProperty("--cat-color", cat.color);
      btn.style.setProperty("--cat-light", cat.colorLight);
      btn.innerHTML = `<span class="cat-emoji" aria-hidden="true">${cat.emoji}</span><span class="cat-name">${cat.nombre}</span>`;
      btn.addEventListener("click", () => {
        active = cat.id; render(); PictoGrid.render(cat.id);
      });
      container.appendChild(btn);
    });
  }

  return { render };
})();

/* =====================================================
   CUADRÍCULA DE PICTOGRAMAS
   ===================================================== */
const PictoGrid = (() => {
  const grid = document.getElementById("pictoGrid");

  function render(categoryId) {
    const cat = CATEGORIES.find(c => c.id === categoryId);
    if (!cat) return;

    grid.classList.add("fade-out");
    setTimeout(() => {
      grid.innerHTML = "";
      cat.items.forEach(item => {
        const card = document.createElement("button");
        card.className = "picto-card";
        card.setAttribute("aria-label", item.label);
        card.style.setProperty("--cat-color", cat.color);
        card.style.setProperty("--cat-light", cat.colorLight);
        card.innerHTML = `
          <span class="picto-emoji" aria-hidden="true">${item.emoji}</span>
          <span class="picto-label">${item.label}</span>
        `;
        card.addEventListener("click", () => {
          VoiceEngine.speak(item.voz);
          PhraseBar.add(item);
          card.classList.add("pressed");
          setTimeout(() => card.classList.remove("pressed"), 300);
        });
        // Respuesta táctil inmediata
        card.addEventListener("touchstart", () => card.classList.add("pressed"), { passive: true });
        card.addEventListener("touchend",   () => setTimeout(() => card.classList.remove("pressed"), 200), { passive: true });
        grid.appendChild(card);
      });
      grid.classList.remove("fade-out");
      grid.classList.add("fade-in");
      setTimeout(() => grid.classList.remove("fade-in"), 300);
    }, 150);
  }

  return { render };
})();

/* =====================================================
   PANEL DE AJUSTES
   ===================================================== */
const Settings = (() => {
  const overlay      = document.getElementById("settingsOverlay");
  const btnOpen      = document.getElementById("btnSettings");
  const btnClose     = document.getElementById("btnCloseSettings");
  const voiceSelect  = document.getElementById("voiceSelect");
  const rateRange    = document.getElementById("rateRange");
  const rateVal      = document.getElementById("rateVal");
  const pitchRange   = document.getElementById("pitchRange");
  const pitchVal     = document.getElementById("pitchVal");
  const fontSizeRange= document.getElementById("fontSizeRange");
  const fontSizeVal  = document.getElementById("fontSizeVal");

  const open  = () => { overlay.removeAttribute("hidden"); btnClose.focus(); };
  const close = () => { overlay.setAttribute("hidden",""); btnOpen.focus(); };

  function populateVoiceSelect() {
    const v = VoiceEngine.getVoices();
    voiceSelect.innerHTML = "";
    v.forEach((voice, i) => {
      const opt = document.createElement("option");
      opt.value = i;
      opt.textContent = `${voice.name} (${voice.lang})`;
      if (voice.lang.startsWith("es")) opt.selected = true;
      voiceSelect.appendChild(opt);
    });
  }

  btnOpen.addEventListener("click", open);
  btnClose.addEventListener("click", close);
  overlay.addEventListener("click", e => { if (e.target === overlay) close(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !overlay.hidden) close(); });

  voiceSelect.addEventListener("change",  e => VoiceEngine.setVoice(parseInt(e.target.value)));
  rateRange.addEventListener("input",     e => { VoiceEngine.setRate(e.target.value);  rateVal.textContent  = parseFloat(e.target.value).toFixed(1); });
  pitchRange.addEventListener("input",    e => { VoiceEngine.setPitch(e.target.value); pitchVal.textContent = parseFloat(e.target.value).toFixed(1); });
  fontSizeRange.addEventListener("input", e => {
    const s = parseInt(e.target.value);
    fontSizeVal.textContent = s;
    document.documentElement.style.setProperty("--picto-font-size", s + "px");
  });

  return { populateVoiceSelect };
})();

/* =====================================================
   INICIALIZACIÓN
   ===================================================== */
(function init() {
  VoiceEngine.loadVoices();
  CategoryNav.render();
  PictoGrid.render(CATEGORIES[0].id);
  // Saludo de bienvenida
  setTimeout(() => VoiceEngine.speak("Hola, bienvenido a MiVoz"), 900);
})();
</script>
